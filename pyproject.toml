[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sublevel-flood"
version = "0.1"
description = "A package that computes the sublevel Flood bifiltration, a scalable approach for using 2-parameter persistent homology with large-scale, low-dimensional point sets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fpsample",
    "gudhi",
    "multipers >= 2.6.0",
    "numpy",
    "torch",
]

[project.urls]
Homepage = "https://github.com/MClemot/SLFlood"

[project.optional-dependencies]
sklearn = ["scikit-learn"]
test = ["pytest", "scikit-learn"]

[tool.hatch.build.targets.wheel]
packages = ["slflood"]
