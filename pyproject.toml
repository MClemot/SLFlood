[build-system]
requires = [
    "scikit-build-core >=0.11",
    "nanobind >=2.0"
    ]
build-backend = "scikit_build_core.build"

[project]
name = "sublevel-flood"
dynamic = ["version"]
description = "A package that computes the sublevel Flood bifiltration, a scalable approach for using 2-parameter persistent homology with large-scale, low-dimensional point sets."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND GPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/*"]
dependencies = [
    "fpsample",
    "multipers >= 2.6.0",
    "numpy",
    "torch",
]

[project.urls]
Homepage = "https://github.com/MClemot/SLFlood"

[project.optional-dependencies]
sklearn = ["scikit-learn"]
test = ["pytest", "scikit-learn"]

[tool.scikit-build]
wheel.packages = ["slflood"]
# Protect the configuration against future changes in scikit-build-core
minimum-version = "build-system.requires"
# Setuptools-style build caching in a local directory
build-dir = "build/{wheel_tag}"
# Build stable ABI wheels for CPython 3.12+
wheel.py-api = "cp312"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "slflood/__init__.py"

[tool.cibuildwheel]
build-verbosity = 1
skip = "cp*t-*"

# Run the package tests using `pytest`
# test-requires = ["pytest"]
# test-command = "pytest {package}/tests"

[tool.cibuildwheel.linux]
build = "cp*-manylinux_x86_64"
before-all = "yum install -y boost-devel CGAL-devel eigen3-devel mpfr-devel gmp-devel"
